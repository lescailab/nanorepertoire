---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "nanorepertoire_report"
description: Generates final HTML report of nanobody repertoire based on sequence clusters
keywords:
  - report
  - nanobody
  - visualization
tools:
  - "python":
      description: "Python language script for generating the final comprehensive HTML report"
      homepage: "https://www.python.org/"
      documentation: "https://docs.python.org/"

input:
  - clustercounts:
      type: file
      description: CSV file with cluster counts
      pattern: "*.csv"
  - cdrcounts:
      type: file
      description: CSV file with CDR counts
      pattern: "*.csv"
  - cdrhists:
      type: file
      description: CSV file with CDR histograms
      pattern: "*.csv"
  - clusterbig:
      type: file
      description: CSV file with bigger clusters
      pattern: "*.csv"
  - fastaseq:
      type: file
      description: CSV file with corresponding FASTA sequences
      pattern: "*.csv"
  - cutadapt_logs:
      type: file
      description: Per-sample Cutadapt reports, for the sequence accounting table
      pattern: "*.cutadapt.log"
  - translation_logs:
      type: file
      description: Per-sample translation logs, for the sequence accounting table
      pattern: "*_AA_translated.fasta.log"
  - cdr3_summaries:
      type: file
      description: Per-sample nanoCDR-X summaries, for the sequence accounting table
      pattern: "*_cdr3_summary.tsv"

output:
  - report:
      type: file
      description: Final generated HTML interactive report
      pattern: "*.html"
  - accounting:
      type: file
      description: Number of sequences of each sample at every step of the pipeline, and of those lost between steps
      pattern: "sequence_accounting.tsv"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@davidebag"
  - "@lescai"
maintainers:
  - "@davidebag"
  - "@lescai"
