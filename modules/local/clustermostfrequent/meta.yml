---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "clustermostfrequent"
description: |
  Chooses, for every CD-HIT cluster, its most frequent sequence, on which the CDR3 of the cluster
  is annotated, instead of the CD-HIT representative (the longest sequence of the cluster).
keywords:
  - nanobodies
  - clustering
  - cdr3
tools:
  - "python":
      description: "Python standard library script bin/cluster_most_frequent.py"
      homepage: "https://www.python.org/"
      documentation: "https://docs.python.org/3/"
      licence: ["PSF-2.0"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', single_end:false ]`
  - sequences:
      type: file
      description: FASTA file clustered by CD-HIT (the translated VHH sequences)
      pattern: "*.{fasta,fa}"
  - clusters:
      type: file
      description: CD-HIT cluster file
      pattern: "*.clstr"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', single_end:false ]`
  - fasta:
      type: file
      description: |
        One sequence per cluster: the header is the identifier of the CD-HIT representative,
        the sequence is the most frequent sequence of the cluster
      pattern: "*_most_frequent.fasta"
  - tsv:
      type: file
      description: |
        One row per cluster: CD-HIT representative, chosen member, cluster size, copies and share
        of the chosen sequence, lengths of the two sequences, whether they are identical
      pattern: "*_most_frequent.tsv"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@davidebag"
maintainers:
  - "@davidebag"
